<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Popup variants 2</title>
    <style>
      :root {
        --bg: url('../assets/images/background.jpg');
        --ink: #1d0a33;
        --pink: #ff8fb8;
        --deep: #1a0b2e;
        --grad: linear-gradient(135deg, #7f3fe0, #e83fb4 55%, #ffa94d);
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: #0f0b16; color: #fff; font: 14px/1.5 system-ui, sans-serif; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .note { margin: 0 0 28px; color: #a99bbd; }
      .grid { display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start; }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; font-weight: 700; }
      figcaption span { display: block; font-weight: 400; font-size: 12px; color: #a99bbd; max-width: 340px; }
      p { margin: 0; }
      .pop { width: 340px; overflow: hidden; border-radius: 14px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55); }
      .desc { font-size: 13px; min-height: 40px; margin: 12px 0; }
      .hint { font-size: 11px; opacity: 0.8; }
      .panic { display: flex; align-items: center; gap: 10px; }
      .panic input { accent-color: #e83fb4; width: 16px; height: 16px; }
      .seg { display: grid; grid-template-columns: repeat(4, 1fr); padding: 3px; border-radius: 999px; }
      .seg button { padding: 6px 0; border: 0; border-radius: 999px; background: none; font: 600 12px system-ui; }
      .seg .on { background: var(--grad); color: #fff; box-shadow: 0 2px 10px rgba(232, 63, 180, 0.45); }
      .banner { position: relative; height: 150px; background: var(--bg) center 58% / cover; }
      .banner img { position: absolute; left: 50%; bottom: 14px; width: 120px; transform: translateX(-50%); filter: drop-shadow(0 4px 14px rgba(20, 0, 40, 0.6)); }
      h2 { margin: 0 0 12px; font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; }

      /* 1: banner fading into a deep purple sheet */
      .v1 { background: var(--deep); }
      .v1 .banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 45%, var(--deep)); }
      .v1 .banner img { z-index: 1; }
      .v1 .sheet { padding: 4px 18px 18px; }
      .v1 h2 { color: #c9a6f0; text-align: center; }
      .v1 .seg { background: rgba(255, 255, 255, 0.1); }
      .v1 .seg button { color: #d9c4e6; }
      .v1 .desc { color: #eadcf5; }
      .v1 .panic { padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.07); }

      /* 2: banner + light lavender sheet with rounded top (B's clean sheet) */
      .v2 { background: #3a1a63; }
      .v2 .sheet { margin-top: -22px; position: relative; padding: 18px; border-radius: 22px 22px 0 0; background: #f6f0fc; color: var(--ink); }
      .v2 h2 { color: #8a4fb8; }
      .v2 .seg { background: #e8dbf6; }
      .v2 .seg button { color: #5d3d80; }
      .v2 .desc { color: #4a3560; }
      .v2 .panic { padding: 10px 12px; border-radius: 12px; background: #fff; }
      .v2 .hint { margin-top: 8px; color: #6b4a8a; }

      /* 3: whole popup is purple-washed art, light glass card floats on it */
      .v3 { padding: 20px 16px 16px; text-align: center; background: linear-gradient(rgba(60, 20, 110, 0.55), rgba(40, 10, 80, 0.78)), var(--bg) center / cover; }
      .v3 img { width: 130px; filter: drop-shadow(0 4px 14px rgba(20, 0, 40, 0.6)); }
      .v3 .card { margin-top: 16px; padding: 16px; border-radius: 18px; text-align: left; background: rgba(255, 255, 255, 0.92); color: var(--ink); }
      .v3 h2 { color: #8a4fb8; text-align: center; }
      .v3 .seg { background: #eadff7; }
      .v3 .seg button { color: #5d3d80; }
      .v3 .desc { color: #4a3560; }
      .v3 .panic { padding-top: 10px; border-top: 1px solid #e3d3f2; }

      /* 4: banner, dark sheet, level rows (radio list) */
      .v4 { background: var(--deep); }
      .v4 .banner { height: 120px; }
      .v4 .banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 40%, var(--deep)); }
      .v4 .banner img { z-index: 1; width: 100px; }
      .v4 .sheet { padding: 0 14px 14px; }
      .row { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 10px; color: #d9c4e6; }
      .row i { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #7d5ca3; transform: translateY(1px); }
      .row b { font-size: 13px; }
      .row span { font-size: 11px; opacity: 0.8; margin-left: auto; }
      .row.on { background: linear-gradient(135deg, rgba(127, 63, 224, 0.4), rgba(232, 63, 180, 0.3)); color: #fff; }
      .row.on i { border-color: var(--pink); background: radial-gradient(var(--pink) 45%, transparent 50%); }
      .v4 .panic { margin-top: 10px; padding: 10px 4px 0; border-top: 1px solid rgba(255, 255, 255, 0.12); }
      .v4 .desc { margin: 8px 4px 0; min-height: 0; color: #cdb8e0; }
    </style>
  </head>
  <body>
    <h1>Popup variants, round 2</h1>
    <p class="note">B's clean layout with C's purple background. Static mock-ups at 340px.</p>
    <div class="grid">
      <figure>
        <figcaption>1 · Banner, deep sheet <span>Art fades into dark purple. Closest to C, B's pill control.</span></figcaption>
        <div class="pop v1">
          <div class="banner"><img src="../assets/images/gta-vi-logo.png" alt="" /></div>
          <div class="sheet">
            <h2>Spoiler Shield</h2>
            <div class="seg"><button>Block all</button><button class="on">News</button><button>Story</button><button>Off</button></div>
            <p class="desc">Allows news, trailers, release info, score and OST. Hides story and gameplay.</p>
            <label class="panic"><input type="checkbox" /> <b>Panic mode</b></label>
            <p class="hint" style="margin: 8px 0 0">Also hides generic spoiler phrases ("who dies") on any video.</p>
          </div>
        </div>
      </figure>

      <figure>
        <figcaption>2 · Banner, light sheet <span>B's bright sheet rising over the art. Most readable text.</span></figcaption>
        <div class="pop v2">
          <div class="banner"><img src="../assets/images/gta-vi-logo.png" alt="" /></div>
          <div class="sheet">
            <h2>Spoiler Shield</h2>
            <div class="seg"><button>Block all</button><button class="on">News</button><button>Story</button><button>Off</button></div>
            <p class="desc">Allows news, trailers, release info, score and OST. Hides story and gameplay.</p>
            <label class="panic"><input type="checkbox" /> <b>Panic mode</b></label>
            <p class="hint">Also hides generic spoiler phrases ("who dies", "all endings") on any video.</p>
          </div>
        </div>
      </figure>

      <figure>
        <figcaption>3 · Purple wash, floating card <span>The whole popup is the art under a purple tint; one light card on top.</span></figcaption>
        <div class="pop v3">
          <img src="../assets/images/gta-vi-logo.png" alt="" />
          <div class="card">
            <h2>Spoiler Shield</h2>
            <div class="seg"><button>Block all</button><button class="on">News</button><button>Story</button><button>Off</button></div>
            <p class="desc">Allows news, trailers, release info, score and OST. Hides story and gameplay.</p>
            <label class="panic"><input type="checkbox" /> <b>Panic mode</b></label>
          </div>
        </div>
      </figure>

      <figure>
        <figcaption>4 · Banner, level rows <span>Dark sheet with a radio list: all four levels visible, selected one glows. Shortest banner.</span></figcaption>
        <div class="pop v4">
          <div class="banner"><img src="../assets/images/gta-vi-logo.png" alt="" /></div>
          <div class="sheet">
            <div class="row"><i></i><b>Block all</b><span>every GTA VI tile</span></div>
            <div class="row on"><i></i><b>News only</b><span>hides story + gameplay</span></div>
            <div class="row"><i></i><b>Story only</b><span>hides spoilers</span></div>
            <div class="row"><i></i><b>Off</b><span>nothing hidden</span></div>
            <label class="panic"><input type="checkbox" /> <b>Panic mode</b></label>
          </div>
        </div>
      </figure>
    </div>
  </body>
</html>
