<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Card text variants</title>
    <style>
      :root {
        --bg: url('../assets/images/background.jpg');
        --grad: linear-gradient(135deg, #7f3fe0, #e83fb4 55%, #ffa94d);
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; background: #0f0f0f; color: #fff; font: 14px/1.4 system-ui, sans-serif; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .note { margin: 0 0 24px; color: #aaa; }
      .grid { display: grid; grid-template-columns: repeat(2, 460px); gap: 30px 34px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 8px; font-weight: 700; }
      figcaption span { display: block; font-weight: 400; font-size: 12px; color: #aaa; max-width: 440px; }
      .sizes { display: flex; gap: 14px; align-items: flex-end; }

      /* shared card: --u scales everything, like the real card does from its own size */
      .card { --u: 1; position: relative; flex: none; width: 440px; height: 248px; border-radius: 12px; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer;
        color: #fff; text-shadow: 0 1px 6px rgba(20, 0, 40, 0.8);
        background: linear-gradient(rgba(25, 5, 45, 0.4), rgba(25, 5, 45, 0.4)), var(--bg) center / cover; font-size: calc(14px * var(--u)); }
      .card.sm { --u: 0.62; width: 168px; height: 94px; border-radius: 8px; }
      .logo { height: calc(66px * var(--u)); filter: drop-shadow(0 2px 8px rgba(20, 0, 40, 0.6)); }

      /* A: current, for reference */
      .a { gap: calc(8px * var(--u)); }
      .a b { font-size: calc(16px * var(--u)); }
      .a i { font-style: normal; padding: 0.35em 1em; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 999px; background: rgba(20, 5, 40, 0.5); font-size: 0.78em; font-weight: 600; text-shadow: none; }

      /* B: severity chip on top, calm one-line hint under it, logo as a watermark corner */
      .b { gap: calc(10px * var(--u)); }
      .b .logo { height: calc(58px * var(--u)); }
      .b em { font-style: normal; padding: 0.25em 0.9em; border-radius: 999px; font-size: 0.72em; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; text-shadow: none; background: #e83fb4; }
      .b em.game { background: #ff9a3d; color: #2a1200; }
      .b span { font-size: 0.82em; opacity: 0.9; }
      .b b { font-size: calc(17px * var(--u)); line-height: 1.15; }

      /* C: left-aligned editorial: small logo top-left, big kind bottom-left, Reveal arrow right */
      .c { align-items: stretch; justify-content: space-between; padding: calc(16px * var(--u)); text-align: left; background: linear-gradient(rgba(25, 5, 45, 0.15), rgba(25, 5, 45, 0.7)), var(--bg) center / cover; }
      .c .logo { height: calc(44px * var(--u)); align-self: flex-start; }
      .c .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
      .c .foot b { display: block; font-size: calc(20px * var(--u)); line-height: 1.1; }
      .c .foot small { display: block; font-size: 0.8em; opacity: 0.85; font-weight: 500; margin-top: 2px; }
      .c .foot i { font-style: normal; flex: none; padding: 0.45em 1em; border-radius: 999px; background: #fff; color: #2b1055; font-weight: 700; font-size: 0.8em; text-shadow: none; }

      /* D: glass panel: everything sits in a frosted rounded plate */
      .d .plate { display: flex; flex-direction: column; align-items: center; gap: calc(6px * var(--u)); padding: calc(14px * var(--u)) calc(26px * var(--u)); border-radius: calc(16px * var(--u)); background: rgba(25, 5, 45, 0.55); border: 1px solid rgba(255, 255, 255, 0.22); backdrop-filter: blur(8px); }
      .d .logo { height: calc(48px * var(--u)); }
      .d b { font-size: calc(15px * var(--u)); }
      .d small { font-size: 0.78em; opacity: 0.8; }

      /* E: big logo, kind as a gradient pill that is the button itself */
      .e { gap: calc(12px * var(--u)); }
      .e .logo { height: calc(78px * var(--u)); }
      .e button { padding: 0.55em 1.3em; border: 0; border-radius: 999px; background: var(--grad); color: #fff; font: 700 0.95em system-ui; text-shadow: none; box-shadow: 0 4px 16px rgba(232, 63, 180, 0.45); }
      .e small { font-size: 0.74em; opacity: 0.85; margin-top: -4px; }

      /* F: minimal, no logo: just a big word and a thin line */
      .f { gap: calc(8px * var(--u)); background: linear-gradient(rgba(25, 5, 45, 0.5), rgba(25, 5, 45, 0.5)), var(--bg) center / cover; }
      .f b { font-size: calc(24px * var(--u)); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
      .f hr { width: calc(48px * var(--u)); border: 0; height: 2px; margin: 0; background: var(--grad); }
      .f small { font-size: 0.8em; opacity: 0.85; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <h1>Card text variants</h1>
    <p class="note">Each shown at a feed-tile size and a small sidebar size. The real card scales the same way from its own width and height.</p>
    <div class="grid">
      <figure>
        <figcaption>A · Current <span>Bold kind, pill hint. For reference.</span></figcaption>
        <div class="sizes">
          <div class="card a"><img class="logo" src="../assets/images/gta-vi-logo.png" alt="" /><b>Story spoiler</b><i>Click to reveal</i></div>
          <div class="card sm a"><img class="logo" src="../assets/images/gta-vi-logo.png" alt="" /><b>Story spoiler</b><i>Click to reveal</i></div>
        </div>
      </figure>

      <figure>
        <figcaption>B · Severity chip <span>Coloured chip says the kind (pink story, orange gameplay), a plain line says what to do. Easiest to scan in a busy feed.</span></figcaption>
        <div class="sizes">
          <div class="card b"><img class="logo" src="../assets/images/gta-vi-logo.png" alt="" /><em>Story</em><b>Spoiler hidden</b><span>Click to reveal</span></div>
          <div class="card sm b"><img class="logo" src="../assets/images/gta-vi-logo.png" alt="" /><em class="game">Gameplay</em><b>Spoiler hidden</b></div>
        </div>
      </figure>

      <figure>
        <figcaption>C · Editorial, left-aligned <span>Small logo top-left, big kind bottom-left, white Reveal button right. Feels like a poster.</span></figcaption>
        <div class="sizes">
          <div class="card c"><img class="logo" src="../assets/images/gta-vi-logo.png" alt="" /><div class="foot"><div><b>Story spoiler</b><small>Hidden by Spoiler Shield</small></div><i>Reveal</i></div></div>
          <div class="card sm c"><img class="logo" src="../assets/images/gta-vi-logo.png" alt="" /><div class="foot"><div><b>Story spoiler</b></div><i>Reveal</i></div></div>
        </div>
      </figure>

      <figure>
        <figcaption>D · Glass plate <span>Logo, kind and hint inside one frosted plate, so text stays readable over any part of the art.</span></figcaption>
        <div class="sizes">
          <div class="card d"><div class="plate"><img class="logo" src="../assets/images/gta-vi-logo.png" alt="" /><b>Story spoiler</b><small>Click to reveal</small></div></div>
          <div class="card sm d"><div class="plate"><b>Story spoiler</b><small>Click to reveal</small></div></div>
        </div>
      </figure>

      <figure>
        <figcaption>E · Button is the card <span>Big logo, one gradient button that names the kind and is what you click. Strongest call to action.</span></figcaption>
        <div class="sizes">
          <div class="card e"><img class="logo" src="../assets/images/gta-vi-logo.png" alt="" /><button>Reveal story spoiler</button><small>Hidden by Spoiler Shield</small></div>
          <div class="card sm e"><button>Reveal story</button></div>
        </div>
      </figure>

      <figure>
        <figcaption>F · Type only <span>No logo. A big uppercase kind, a thin gradient line, a small hint. Cleanest and quietest.</span></figcaption>
        <div class="sizes">
          <div class="card f"><b>Story spoiler</b><hr /><small>Click to reveal</small></div>
          <div class="card sm f"><b>Story spoiler</b><hr /><small>Click to reveal</small></div>
        </div>
      </figure>
    </div>
  </body>
</html>
