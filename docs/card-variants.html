<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hiding card variants</title>
    <style>
      :root {
        --bg: url('../assets/images/background.jpg');
        --logo: url('../assets/images/gta-vi-logo.png');
        --grad: linear-gradient(135deg, #7f3fe0, #e83fb4 55%, #ffa94d);
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; background: #0f0f0f; color: #fff; font: 14px/1.4 system-ui, sans-serif; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .note { margin: 0 0 24px; color: #aaa; }
      .grid { display: grid; grid-template-columns: repeat(2, 440px); gap: 28px 32px; }
      figcaption { margin-bottom: 8px; font-weight: 700; }
      figcaption span { display: block; font-weight: 400; font-size: 12px; color: #aaa; }
      figure { margin: 0; }
      .row { display: flex; gap: 12px; align-items: flex-start; }
      .card { position: relative; width: 440px; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; display: flex;
        align-items: center; justify-content: center; text-align: center; cursor: pointer; color: #fff;
        background: var(--bg) center / cover; text-shadow: 0 1px 8px rgba(20, 0, 40, 0.85); }
      .lock { font-size: 15px; }
      .sub { font-size: 12px; opacity: 0.9; }

      /* 1 minimal: logo mark above two lines */
      .c1 { flex-direction: column; gap: 4px; background: linear-gradient(rgba(25, 5, 45, 0.25), rgba(25, 5, 45, 0.25)), var(--bg) center / cover; }
      .c1::before { content: ''; width: 92px; height: 66px; margin-bottom: 6px; background: var(--logo) center / contain no-repeat; filter: drop-shadow(0 2px 8px rgba(20, 0, 40, 0.6)); }
      .c1 b { font-size: 15px; letter-spacing: 0.3px; }

      /* 2 frosted pill in the centre, art untouched */
      .c2 { flex-direction: column; gap: 10px; }
      .c2 .pill { padding: 10px 20px; border-radius: 999px; background: rgba(25, 5, 45, 0.62); border: 1px solid rgba(255, 255, 255, 0.25); }
      .c2 .pill b { display: block; font-size: 14px; }
      .c2 .pill span { font-size: 11px; opacity: 0.85; }

      /* 3 poster: big logo, footer bar with label and reveal hint */
      .c3 { align-items: stretch; flex-direction: column; justify-content: space-between; background: linear-gradient(rgba(60, 20, 110, 0.35), rgba(40, 10, 80, 0.55)), var(--bg) center / cover; }
      .c3 .art { flex: 1; background: var(--logo) center / auto 62% no-repeat; filter: drop-shadow(0 4px 14px rgba(20, 0, 40, 0.6)); }
      .c3 .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(20, 5, 40, 0.72); font-size: 13px; text-shadow: none; }
      .c3 .bar i { font-style: normal; padding: 4px 12px; border-radius: 999px; background: var(--grad); font-weight: 700; font-size: 12px; }

      /* 4 dark scrim, severity chip colour */
      .c4 { flex-direction: column; gap: 8px; background: linear-gradient(rgba(15, 5, 30, 0.72), rgba(15, 5, 30, 0.72)), var(--bg) center / cover; }
      .c4 .chip { padding: 3px 12px; border-radius: 999px; font: 700 11px system-ui; letter-spacing: 1px; text-transform: uppercase; text-shadow: none; background: #e83fb4; }
      .c4 .chip.game { background: #ff9a3d; color: #2a1200; }
      .c4 .chip.news { background: #7f3fe0; }
      .c4 b { font-size: 15px; }
    </style>
  </head>
  <body>
    <h1>Hiding card variants</h1>
    <p class="note">Real card is a CSS overlay on the tile, so it can show text and background layers only. Colours per severity (variant 4) need one extra attribute.</p>
    <div class="grid">
      <figure>
        <figcaption>1 · Minimal logo <span>Logo mark, label, hint. Calm, lets the art breathe.</span></figcaption>
        <div class="card c1"><b>Story spoiler</b><span class="sub">Click to reveal</span></div>
      </figure>

      <figure>
        <figcaption>2 · Frosted pill <span>Art untouched, one pill in the centre. Least intrusive in a feed.</span></figcaption>
        <div class="card c2"><div class="pill"><b>🔒 Gameplay spoiler</b><span>Click to reveal</span></div></div>
      </figure>

      <figure>
        <figcaption>3 · Poster with footer bar <span>Big logo, bottom bar with label and a Reveal button look. Most branded.</span></figcaption>
        <div class="card c3"><div class="art"></div><div class="bar"><span>🔒 Story spoiler</span><i>Reveal</i></div></div>
      </figure>

      <figure>
        <figcaption>4 · Dark scrim, severity chip <span>Darker art, coloured chip: pink story, orange gameplay, purple news. Easiest to scan.</span></figcaption>
        <div class="row">
          <div class="card c4"><span class="chip">Story</span><b>Spoiler hidden</b><span class="sub">Click to reveal</span></div>
        </div>
      </figure>
    </div>
  </body>
</html>
