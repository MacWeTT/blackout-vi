<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="poster">
      <img class="poster__logo" src="../../assets/images/gta-vi-logo.png" alt="Grand Theft Auto VI" />
    </header>

    <main class="sheet" id="main">
      <h1 class="sheet__title">Spoiler Shield</h1>

      <label class="box">
        <span class="box__text">
          <b>Global settings</b>
          <small id="globalHint">The same rules on YouTube, X and Reddit</small>
        </span>
        <input class="switch" id="global" type="checkbox" />
      </label>

      <div class="sites" id="sites" hidden>
        <button class="site" data-site="youtube" type="button" title="YouTube" aria-label="YouTube">
          <svg viewBox="0 0 28 20" width="28" height="20" aria-hidden="true">
            <rect width="28" height="20" rx="6" fill="#ff0000" />
            <path d="M11 5.5v9l8-4.5z" fill="#fff" />
          </svg>
        </button>
        <button class="site" data-site="x" type="button" title="X" aria-label="X">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M3 3h5l4.2 5.8L17 3h3l-6.4 7.4L21 21h-5l-4.6-6.3L6 21H3l7-8z" fill="#111" />
          </svg>
        </button>
        <button class="site" data-site="reddit" type="button" title="Reddit (coming soon)" aria-label="Reddit">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <circle cx="12" cy="12" r="11" fill="#ff4500" />
            <ellipse cx="12" cy="14" rx="6.5" ry="4.5" fill="#fff" />
            <circle cx="9.5" cy="13.5" r="1.1" fill="#ff4500" />
            <circle cx="14.5" cy="13.5" r="1.1" fill="#ff4500" />
            <circle cx="16.5" cy="7" r="1.5" fill="#fff" />
          </svg>
        </button>
      </div>

      <h2 class="sheet__heading">Show me</h2>
      <div class="levels" id="levels">
        <button class="levels__button" data-level="all">Nothing</button>
        <button class="levels__button" data-level="news">News only</button>
        <button class="levels__button" data-level="story">No story</button>
        <button class="levels__button" data-level="off">Everything</button>
      </div>
      <p class="sheet__desc" id="desc"></p>

      <h2 class="sheet__heading" id="trustHeading">Trusted</h2>
      <div id="trustRows"></div>
      <p class="sheet__desc sheet__desc--small" id="siteNote" hidden></p>

      <label class="box">
        <input class="box__check" id="panic" type="checkbox" />
        <span class="box__text">
          <b>Panic mode</b>
          <small
            >Also hides generic spoiler phrases ("who dies", "all endings") on any video, even without a GTA
            mention</small
          >
        </span>
      </label>
    </main>

    <main class="sheet" id="channels" hidden>
      <button class="link link--back" id="back" type="button">
        &larr; <span id="manageTitle">Trusted channels</span>
      </button>
      <div class="levels levels--three" id="modes">
        <button class="levels__button" data-mode="off">Off</button>
        <button class="levels__button" data-mode="gameplay">Allow gameplay</button>
        <button class="levels__button" data-mode="all">Allow all</button>
      </div>
      <p class="sheet__desc sheet__desc--small" id="modeDesc"></p>
      <input class="search" id="search" type="search" placeholder="Search" />
      <div class="list" id="list"></div>
      <div class="box">
        <span class="box__text">
          <b id="syncTitle">Not synced yet</b>
          <small id="syncDetail"></small>
        </span>
        <button class="pill" id="sync" type="button">Sync now</button>
      </div>
    </main>

    <script src="../core/trust.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
