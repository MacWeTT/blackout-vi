<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hd"></header>

    <nav class="tabs" id="tabs">
      <button class="tabs__tab" data-view="rules" type="button">Rules</button>
      <button class="tabs__tab" data-view="trusted" type="button">Trusted</button>
    </nav>

    <main class="bd" id="rules">
      <label class="box">
        <span class="box__text">
          <b>Global settings</b>
          <small id="globalHint">One set of rules for YouTube, X and Reddit</small>
        </span>
        <input class="switch" id="global" type="checkbox" />
      </label>

      <div class="cap cap--gap"><span>Show me</span><span class="chip" id="scopeChip">All sites</span></div>

      <div id="globalRules">
        <div class="levels" id="levels">
          <button class="levels__button" data-level="all" type="button">Nothing</button>
          <button class="levels__button" data-level="news" type="button">Content</button>
          <button class="levels__button" data-level="story" type="button">Gameplay</button>
          <button class="levels__button" data-level="off" type="button">Everything</button>
        </div>
        <p class="desc" id="desc"></p>
      </div>

      <div id="siteRules" hidden></div>

      <div class="box box--gap box--wrap" id="panicBox">
        <span class="box__text">
          <b>Panic mode</b>
          <small>Also hides generic spoiler phrases ("who dies", "all endings") on any video</small>
        </span>
        <input class="switch" id="panic" type="checkbox" aria-label="Panic mode" />
        <div class="panic-sites" id="panicSites" hidden></div>
      </div>
    </main>

    <main class="bd" id="trusted" hidden>
      <div class="levels levels--two" id="siteSwitch">
        <button class="levels__button" data-trust-site="youtube" type="button">YouTube channels</button>
        <button class="levels__button" data-trust-site="x" type="button">X accounts</button>
      </div>
      <div class="levels levels--three levels--gap" id="modes">
        <button class="levels__button" data-mode="off" type="button">Off</button>
        <button class="levels__button" data-mode="gameplay" type="button">Allow gameplay</button>
        <button class="levels__button" data-mode="all" type="button">Allow all</button>
      </div>
      <p class="desc" id="modeDesc"></p>
      <input class="search" id="search" type="search" placeholder="Search" />
      <div class="list" id="list"></div>
      <div class="box box--gap">
        <span class="box__text">
          <b id="syncTitle">Not synced yet</b>
          <small id="syncDetail"></small>
        </span>
        <button class="btn" id="sync" type="button">Sync now</button>
      </div>
    </main>

    <script src="../core/trust.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
