<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hd">
      <button class="gear" id="gear" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path
            fill="currentColor"
            d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.4 7.4 0 0 0-1.7-1l-.4-2.5a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.5 8.8a.5.5 0 0 0 .1.6l2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.5c0 .2.3.4.5.4h3.8c.2 0 .5-.2.5-.4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
          />
        </svg>
      </button>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tabs__tab" data-view="rules" type="button">Rules</button>
      <button class="tabs__tab" data-view="trusted" type="button">Trusted</button>
    </nav>

    <main class="bd" id="rules">
      <div class="cap"><span>Show me</span><span class="chip" id="scopeChip">All sites</span></div>

      <div id="globalRules">
        <div class="levels" id="levels">
          <button class="levels__button" data-level="all" type="button">Nothing</button>
          <button class="levels__button" data-level="news" type="button">News only</button>
          <button class="levels__button" data-level="story" type="button">No story</button>
          <button class="levels__button" data-level="off" type="button">Everything</button>
        </div>
        <p class="desc" id="desc"></p>
      </div>

      <div id="appSummary" hidden>
        <div id="summaryRows"></div>
        <p class="desc">Each app has its own rules. Change them in Settings.</p>
      </div>
    </main>

    <main class="bd" id="trusted" hidden>
      <div class="levels levels--two" id="siteSwitch">
        <button class="levels__button" data-trust-site="youtube" type="button">YouTube channels</button>
        <button class="levels__button" data-trust-site="x" type="button">X accounts</button>
      </div>
      <div class="levels levels--three levels--gap" id="modes">
        <button class="levels__button" data-mode="off" type="button">Off</button>
        <button class="levels__button" data-mode="gameplay" type="button">Allow gameplay</button>
        <button class="levels__button" data-mode="all" type="button">Allow all</button>
      </div>
      <p class="desc" id="modeDesc"></p>
      <input class="search" id="search" type="search" placeholder="Search" />
      <div class="list" id="list"></div>
      <div class="box box--gap">
        <span class="box__text">
          <b id="syncTitle">Not synced yet</b>
          <small id="syncDetail"></small>
        </span>
        <button class="btn" id="sync" type="button">Sync now</button>
      </div>
    </main>

    <main class="bd" id="settings" hidden>
      <button class="back" id="back" type="button">&larr; Settings</button>

      <label class="box">
        <span class="box__text">
          <b>Global settings</b>
          <small id="globalHint">One set of rules for YouTube, X and Reddit</small>
        </span>
        <input class="switch" id="global" type="checkbox" />
      </label>

      <label class="box box--gap" id="panicBox">
        <span class="box__text">
          <b>Panic mode</b>
          <small>Also hides generic spoiler phrases ("who dies", "all endings") on any video</small>
        </span>
        <input class="switch" id="panic" type="checkbox" />
      </label>

      <p class="desc" id="globalNote">Turn Global settings off to give YouTube, X and Reddit their own rules.</p>
      <div id="appCards" hidden></div>
    </main>

    <script src="../core/trust.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
